<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Registration Form</title>
</head>
<body>

    <h1>University Registration Form</h1>
    <p>Please fill out the form</p>
    <hr>

    <form action="/register" method="post">

        <h2>Personal Details</h2>

        <label for="firstName">First Name:</label>
        <input type="text" name="firstName" id="firstName" placeholder="e.g. Manish" required>
        <br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" name="lastName" id="lastName" placeholder="e.g. Chaudhary">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob">
        <br><br>

        <h3>Gender:</h3>

        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">
        <br><br>

        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female">
        <br><br>

        <label for="transgender">Transgender</label>
        <input type="radio" name="gender" id="transgender" value="transgender">
        <br><br>

        <h3>Upload Your Photo</h3>
        <input type="file" name="photo">

        <hr>

        <h2>Contact Information</h2>

        <label for="email">Email Address:</label>
        <input type="email" name="email" id="email" placeholder="e.g. you@gmail.com">
        <br><br>

        <label for="phoneNumber">Phone Number:</label>
        <input type="tel" name="phoneNumber" id="phoneNumber" placeholder="e.g. 68652">
        <br><br>

        <label for="address">Mail Address:</label>
        <br>
        <textarea name="address" id="address" rows="10" cols="30"></textarea>

        <hr>

        <h2>Academic Information</h2>

        <label for="course">Select Your Course:</label>
        <select name="course" id="course">
            <option value="CSE">CSE</option>
            <option value="ME">ME</option>
            <option value="Civil">Civil</option>
            <option value="EE">EE</option>
        </select>

        <h3>Extra Curricular Activities</h3>

        <label for="sports">Sports</label>
        <input type="checkbox" name="interest" id="sports" value="sports">
        <br><br>

        <label for="musicArt">Music & Art</label>
        <input type="checkbox" name="interest" id="musicArt" value="musicArt">
        <br><br>

        <label for="technologyClubs">Technology Clubs</label>
        <input type="checkbox" name="interest" id="technologyClubs" value="technologyClubs">
        <br><br>

        <label for="volunteering">Volunteering</label>
        <input type="checkbox" name="interest" id="volunteering" value="volunteering">
        <br><br>

        <hr>

        <h2>Create Your Account</h2>

        <label for="password">Create Password:</label>
        <input type="password" name="password" id="password">
        <br><br>

        <label for="securityQuestion">Security Question:</label>
        <select name="securityQuestion" id="securityQuestion">
            <option value="pet">What is your pet's name?</option>
            <option value="car">What is your car's name?</option>
            <option value="movie">What is your favorite movie?</option>
            <option value="sports">What is your favorite sport?</option>
        </select>
        <br><br>

        <label for="securityAnswer">Security Answer:</label>
        <input type="text" name="securityAnswer" id="securityAnswer">
        <br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions.</label>

        <hr>

        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>

    </form>

</body>
</html>
